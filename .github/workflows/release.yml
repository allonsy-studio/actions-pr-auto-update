name: Release

on:
    push:
        branches: [main]

permissions:
    contents: write # push tags + create the GitHub release
    pull-requests: write # changesets opens the "Version Packages" PR

env:
    GH_TOKEN: ${{ github.token }}

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - name: Create GitHub App token
              id: app-token
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
              with:
                  client-id: ${{ secrets.APP_CLIENT_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write

            - name: Check out code
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  # Full history + tags to detect prior releases; the app token lets
                  # the publish step push tags without re-auth.
                  fetch-depth: 0
                  token: ${{ steps.app-token.outputs.token }}

            - name: Setup
              uses: ./.github/actions/setup

            - name: Create release PR or publish the action
              uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
              with:
                  version: yarn run version
                  publish: yarn release
                  title: "chore(release): version packages"
                  commit: "chore(release): version packages"
                  commitMode: github-api
                  createGithubReleases: false
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
